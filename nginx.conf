server {
    listen 3211;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy para o BFF (Spring Boot, porta 3210) - mesmo dominio/origem
    # do frontend, entao o browser nao precisa de CORS para chamar /api.
    location /api/ {
        proxy_pass http://186.219.134.246:3210/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy para o servico de automacao (Node/Playwright, porta 3212).
    location /automation/ {
        proxy_pass http://186.219.134.246:3212/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # noVNC do fluxo de reautenticacao manual na Matrix (ver
    # automation/src/reauth.js) - precisa de upgrade de conexao p/ websocket.
    location /vnc/ {
        proxy_pass http://186.219.134.246:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: qualquer rota desconhecida cai no index.html (roteamento no client).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
